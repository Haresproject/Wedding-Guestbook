<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Super Admin Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            🔐
        </div>

        <h1>Super Admin</h1>

        <p class="subtitle">
            Masuk ke panel administrator.
        </p>

        <form id="adminLoginForm">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="login-input"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="login-input"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                LOGIN
            </button>

        </form>

        <div id="loading"
             class="loading">

            Memeriksa login...

        </div>

        <div id="message"
             class="message">
        </div>

        <div class="footer">
            Wedding Guestbook
        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-login.js"></script>

</body>

</html>
