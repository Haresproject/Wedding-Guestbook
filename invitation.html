<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan - Wedding Guestbook</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.action-btn{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-right:5px;

    display:inline-flex;
    align-items:center;
    gap:6px;
}

.preview{
    background:#214E43;
    color:white;
}

.wa{
    background:#25D366;
    color:white;
}

.print{
    background:#E8C547;
}
.delivery{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    color:white;
}

.delivery.wa{
    background:#28a745;
}

.delivery.fisik{
    background:#0d6efd;
    color:black;
}

.delivery.both{
    background:#ffc107;
}

.delivery.none{
    background:#dc3545;
}
</style>

</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <img src="assets/logo.png">
            <h2>Wedding Guestbook</h2>
        </div>

        <nav>

            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="guests.html">👥 Daftar Tamu</a>
            <a href="scanner.html">📷 Scanner</a>

            <a href="https://script.google.com/macros/s/AKfycbxypLyJtFO5DdrkBFHPEE6fGqG8HvHyubI4hxfN4jcb00m5auniNEjIvpfQLrFs5Y7P/exec?page=display" target="_blank">
                📺 Display
            </a>

            <a href="invitation.html" class="active">
                💌 Undangan
            </a>

            <a href="settings.html">⚙ Pengaturan</a>

            <a href="#" onclick="logout()">
                🚪 Logout
            </a>

        </nav>

    </aside>

    <main class="content">

        <header class="topbar">
            <h1>💌 Undangan</h1>
        </header>
        <div style="margin:20px 0;">

    <input
        type="text"
        id="searchGuest"
        placeholder="🔍 Cari nama tamu..."
        onkeyup="searchGuest()"
        style="
            width:100%;
            padding:12px 15px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        ">

</div>
<p
    id="resultInfo"
    style="
        margin-top:10px;
        color:#777;
        font-size:14px;
    ">
    Menampilkan 0 tamu
</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0;">

    <button id="prevBtn" class="action-btn">
        ◀ Sebelumnya
    </button>

    <span id="pageInfo">
        Halaman 1 / 1
    </span>

    <button id="nextBtn" class="action-btn">
        Berikutnya ▶
    </button>

</div>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Notes</th>
                    <th>Status Pengiriman</th>
                    <th>Aksi</th>
                </tr>

            </thead>

            <tbody id="guestTable">

            </tbody>

        </table>

    </main>

</div>

<script src="js/api.js"></script>

<script>

if(localStorage.getItem("login")!="true"){
    location.href="index.html";
}

function logout(){

    localStorage.removeItem("login");
    location.href="index.html";

}

</script>

<script src="js/invitation.js"></script>

</body>
</html>
