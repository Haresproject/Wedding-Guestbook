<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan - Wedding Guestbook</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.action-btn{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-right:5px;

    display:inline-flex;
    align-items:center;
    gap:6px;
}

.preview{
    background:#214E43;
    color:white;
}

.wa{
    background:#25D366;
    color:white;
}

.print{
    background:#E8C547;
}
.delivery{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    color:white;
}

.delivery.wa{
    background:#28a745;
}

.delivery.fisik{
    background:#4ac3f3;
    color:rgb(250, 250, 250);
}

.delivery.both{
    background:#ffc107;
}

.delivery.none{
    background:#dc3545;
}
.filter-bar{

    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;

}

.filter-bar button{

    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    background:#f2f2f2;
    font-weight:600;
    transition:.2s;

}

.filter-bar button:hover{

    background:#214E43;
    color:white;

}
.edit-btn{
    background:#6c63ff;
    color:white;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

.edit-btn:hover{
    background:#554ee6;
}

.delete-btn:hover{
    background:#bb2d3b;
}
.modal-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(5px);

    justify-content:center;

    align-items:center;

    z-index:9999;

}


.modal-overlay.show{

    display:flex;

}


.modal-box{

    width:min(500px,90%);

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 20px 60px rgba(0,0,0,.2);

}


.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.modal-header h2{

    margin:0;

}


.modal-close{

    border:none;

    background:none;

    font-size:30px;

    cursor:pointer;

    color:#777;

}


.form-group{

    margin-bottom:15px;

}


.form-group label{

    display:block;

    margin-bottom:6px;

    font-weight:600;

}


.form-group input,
.form-group select{

    width:100%;

    box-sizing:border-box;

    padding:11px 13px;

    border:1px solid #ddd;

    border-radius:9px;

    font-size:14px;

}


.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;

}
</style>

</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <img src="assets/logo.png">
            <h2>Wedding Guestbook</h2>
        </div>

        <nav>

            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="guests.html">👥 Daftar Tamu</a>
            <a href="scanner.html">📷 Scanner</a>

            <a href="https://script.google.com/macros/s/AKfycbxypLyJtFO5DdrkBFHPEE6fGqG8HvHyubI4hxfN4jcb00m5auniNEjIvpfQLrFs5Y7P/exec?page=display" target="_blank">
                📺 Display
            </a>

            <a href="invitation.html" class="active">
                💌 Undangan
            </a>

            <a href="settings.html">⚙ Pengaturan</a>

            <a href="#" onclick="logout()">
                🚪 Logout
            </a>

        </nav>

    </aside>

    <main class="content">

        <header class="topbar">
            <h1>💌 Undangan</h1>
        </header>
        <div style="margin:20px 0;">

    <input
        type="text"
        id="searchGuest"
        placeholder="🔍 Cari nama tamu..."
        onkeyup="searchGuest()"
        style="
            width:100%;
            padding:12px 15px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
        ">

</div>
<div class="filter-bar">

    <button onclick="filterDelivery('all')">
        Semua
    </button>

    <button onclick="filterDelivery('wa')">
        🟢 WhatsApp
    </button>

    <button onclick="filterDelivery('fisik')">
        🔵 Fisik
    </button>

    <button onclick="filterDelivery('both')">
        🟡 Keduanya
    </button>

    <button onclick="filterDelivery('none')">
        🔴 Belum
    </button>

</div>
<p
    id="resultInfo"
    style="
        margin-top:10px;
        color:#777;
        font-size:14px;
    ">
    Menampilkan 0 tamu
</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0;">

    <button id="prevBtn" class="action-btn">
        ◀ Sebelumnya
    </button>

    <span id="pageInfo">
        Halaman 1 / 1
    </span>

    <button id="nextBtn" class="action-btn">
        Berikutnya ▶
    </button>

</div>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Notes</th>
                    <th>Status Pengiriman</th>
                    <th>Aksi</th>
                </tr>

            </thead>

            <tbody id="guestTable">

            </tbody>

        </table>

    </main>

</div>
<!-- =====================================================
     EDIT GUEST MODAL
===================================================== -->

<div id="editGuestModal" class="modal-overlay">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                ✏️ Edit Tamu
            </h2>

            <button
                onclick="closeEditModal()"
                class="modal-close">

                ×

            </button>

        </div>


        <div class="form-group">

            <label>ID</label>

            <input
                type="text"
                id="editGuestId"
                readonly>

        </div>


        <div class="form-group">

            <label>Nama Tamu</label>

            <input
                type="text"
                id="editGuestName"
                placeholder="Nama tamu">

        </div>


        <div class="form-group">

            <label>Notes</label>

            <input
                type="text"
                id="editGuestNotes"
                placeholder="Contoh: Teman sekolah">

        </div>


        <div class="form-group">

            <label>Jenis Undangan</label>

            <select id="editGuestJenis">

                <option value="">
                    Pilih jenis
                </option>

                <option value="VIP">
                    VIP
                </option>

                <option value="Reguler">
                    Reguler
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Tipe Tamu</label>

            <select id="editGuestTipe">

                <option value="">
                    Pilih tipe
                </option>

                <option value="VIP">
                    VIP
                </option>

                <option value="Bridesmaid">
                    Bridesmaid
                </option>

                <option value="Keluarga">
                    Keluarga
                </option>

                <option value="Tamu">
                    Tamu
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="action-btn"
                onclick="closeEditModal()">

                Batal

            </button>


            <button
                class="action-btn edit-btn"
                onclick="saveGuestEdit()">

                💾 Simpan Perubahan

            </button>

        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/invitation.js"></script>

<script>

if(localStorage.getItem("login")!="true"){
    location.href="index.html";
}

function logout(){

    localStorage.removeItem("login");
    location.href="index.html";

}

</script>

</body>
</html>
