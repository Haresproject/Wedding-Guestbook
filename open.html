<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Membuka Undangan...</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:#f8f5f2;
}

.box{
    text-align:center;
}

.loader{
    width:55px;
    height:55px;
    border:6px solid #ddd;
    border-top:6px solid #214E43;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

h2{
    margin-top:25px;
}

</style>

</head>

<body>

<div class="box">

<div class="loader"></div>

<h2>Membuka Undangan...</h2>

</div>

<script src="js/open.js"></script>

</body>
</html>
