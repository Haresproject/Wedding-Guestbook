<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Buku Tamu Digital</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(214, 190, 145, 0.28),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(170, 195, 181, 0.25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f8f5ef,
            #eee8dc
        );

    position: relative;
    overflow: hidden;
}

        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }

        .login-card {
    position: relative;

    background: rgba(255, 255, 255, 0.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.8);

    border-radius: 28px;

    padding: 42px 36px 34px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(72, 63, 48, 0.14),
        0 8px 25px rgba(72, 63, 48, 0.08);

    animation: fadeIn .6s ease;
}

      .login-icon {
    width: 92px;
    height: 92px;

    margin: 0 auto 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff;

    border: 1px solid rgba(190,160,110,.25);

    box-shadow:
        0 10px 30px rgba(120, 95, 55, .12);

    overflow: hidden;
}

.login-icon img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 6px;
}

       h1 {
    margin: 0 0 8px;

    font-size: 27px;

    font-weight: 700;

    letter-spacing: -0.5px;

    color: #214e43;
}

     .subtitle {
    margin: 0 0 28px;

    color: #8a8277;

    font-size: 14px;

    line-height: 1.6;
}

        .admin-info {

            margin-bottom: 20px;

            padding: 10px 12px;

            background: #f5f5f5;

            border-radius: 8px;

            font-size: 13px;

            color: #666;

        }

        .form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 12px;

    font-weight: 700;

    color: #625d55;

    letter-spacing: .3px;
}

       .login-input {
    width: 100%;

    padding: 15px 16px;

    border: 1px solid #e2ddd4;

    border-radius: 12px;

    font-size: 15px;

    outline: none;

    background: rgba(255,255,255,.8);

    color: #333;

    transition: .2s;
}

.login-input::placeholder {
    color: #aaa39a;
}

.login-input:focus {
    border-color: #b9965b;

    background: #fff;

    box-shadow:
        0 0 0 4px rgba(185,150,91,.10);
}

   .login-button {
    width: 100%;

    margin-top: 8px;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #b9925a,
            #c8a46b
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: .3px;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(166,130,72,.20);

    transition:
        transform .2s,
        box-shadow .2s;
}

.login-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 25px rgba(166,130,72,.28);
}

.login-button:active {
    transform: translateY(0);
}  

        .license-box {

            display: none;

            margin-top: 15px;

        }

        .license-box.show {

            display: block;

        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

        }

        .message.error {

            background: #ffebee;

            color: #c62828;

        }

        .message.success {

            background: #e8f5e9;

            color: #2e7d32;

        }

        .loading {

            display: none;

            margin-top: 15px;

            color: #777;

            font-size: 14px;

        }

       .footer {
    margin-top: 28px;

    font-size: 11px;

    color: #aaa196;

    letter-spacing: .5px;
}

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->
        <div class="login-icon">
            <img
                src="assets/logo.png"
                alt="Logo Wedding Guestbook"
            >
        </div>

        <h1>Wedding Guestbook</h1>

        <p class="subtitle">
            Silakan login untuk mengakses sistem.
        </p>


        <!-- LOGIN -->
        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="login-input"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="login-input"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                LOGIN
            </button>

        </form>


        <div
            id="loading"
            class="loading"
        >
            Memeriksa...
        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="footer">
            Buku Tamu Digital
        </div>

    </div>

</div>


<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>

<script src="js/config.js"></script>

<script src="js/login.js"></script>


</body>

</html>
