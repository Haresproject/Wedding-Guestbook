<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Buku Tamu Digital</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #555,
                    #222
                );
        }

        .login-container {

            width: 100%;
            max-width: 430px;
            padding: 20px;

        }

        .login-card {

            background: rgba(255,255,255,.97);

            border-radius: 20px;

            padding: 35px 30px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,.25);

            animation: fadeIn .6s ease;

        }

        .login-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #f5f5f5;

            font-size: 35px;

        }

        h1 {

            margin: 0 0 10px;

            font-size: 26px;

            color: #222;

        }

        .subtitle {

            margin: 0 0 25px;

            color: #777;

            font-size: 14px;

            line-height: 1.6;

        }

        .form-group {

            margin-bottom: 15px;

            text-align: left;

        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: bold;

            color: #555;

        }

        .login-input {

            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

        }

        .login-input:focus {

            border-color: #333;

            box-shadow:
                0 0 0 3px rgba(0,0,0,.05);

        }

        .login-button {

            width: 100%;

            margin-top: 5px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .login-button:hover {

            background: #444;

        }

        .login-button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

        }

        .message.error {

            display: block;

            background: #ffebee;

            color: #c62828;

        }

        .message.success {

            display: block;

            background: #e8f5e9;

            color: #2e7d32;

        }

        .loading {

            display: none;

            margin-top: 15px;

            color: #777;

            font-size: 14px;

        }

        .footer {

            margin-top: 25px;

            font-size: 12px;

            color: #999;

        }

        .hidden {

            display: none !important;

        }

        .license-info {

            margin-bottom: 15px;

            padding: 10px;

            background: #f5f5f5;

            border-radius: 8px;

            font-size: 13px;

            color: #555;

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="login-icon">
            👤
        </div>


        <h1>Login</h1>


        <p class="subtitle">
            Masuk untuk mengelola
            Buku Tamu Digital Anda.
        </p>


        <!-- ================= LICENSE ================= -->

        <form id="licenseForm">


            <div class="form-group">

                <label for="license">

                    License Key

                </label>


                <input
                    type="text"
                    id="license"
                    class="login-input"
                    placeholder="Contoh: HL-XXXXXXXXXXXX"
                    autocomplete="off"
                    required
                >

            </div>


            <button
                type="submit"
                id="licenseButton"
                class="login-button"
            >

                VERIFIKASI LICENSE

            </button>


        </form>


        <!-- ================= CUSTOMER LOGIN ================= -->

        <form
            id="loginForm"
            class="hidden"
        >


            <div
                id="licenseInfo"
                class="license-info"
            >
            </div>


            <div class="form-group">

                <label for="username">

                    Username

                </label>


                <input
                    type="text"
                    id="username"
                    class="login-input"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    class="login-input"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >

                LOGIN

            </button>


        </form>


        <div
            id="loading"
            class="loading"
        >

            Memeriksa...

        </div>


        <div
            id="message"
            class="message"
        >
        </div>


        <div class="footer">

            Buku Tamu Digital

        </div>


    </div>


</div>


<script src="js/config.js"></script>

<script src="js/login.js"></script>


</body>

</html>
